<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/" aria-label="TeachMyPC home">
      <span class="brand-mark" aria-hidden="true">T</span>
      <span class="brand-copy"><strong>TeachMyPC</strong></span>
    </a>

    <nav class="nav-list" aria-label="Main navigation">
      <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
        <span class="nav-icon" aria-hidden="true">⌂</span><span>Workbench</span>
      </a>
      <a class="nav-link" routerLink="/rules" routerLinkActive="active" ariaCurrentWhenActive="page">
        <span class="nav-icon" aria-hidden="true">＋</span><span>Create rule</span>
      </a>
      <a class="nav-link" routerLink="/activity" routerLinkActive="active" ariaCurrentWhenActive="page">
        <span class="nav-icon" aria-hidden="true">◷</span><span>Activity</span>
      </a>
      <a class="nav-link" routerLink="/settings" routerLinkActive="active" ariaCurrentWhenActive="page">
        <span class="nav-icon" aria-hidden="true">⚙</span><span>Settings</span>
      </a>
    </nav>
  </aside>

  <main class="main-area">
    <header class="topbar" aria-label="Application header">
      <span class="topbar-context">TeachMyPC</span>
    </header>
    <section class="page-content">
      <router-outlet />
    </section>
  </main>
</div>
